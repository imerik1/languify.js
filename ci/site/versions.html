<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Languify.js — Versions</title>

  <style>
    :root {
      color-scheme: dark;

      --vp-c-bg: #0b0f14;
      --vp-c-bg-soft: #111826;
      --vp-c-bg-mute: #151c2b;

      --vp-c-text-1: #e5e7eb;
      --vp-c-text-2: #b4bcd0;
      --vp-c-text-3: #6b7280;

      --vp-c-border: rgba(255,255,255,.08);

      --vp-c-brand-1: #ff7a18;
      --vp-c-brand-2: #ff5c00;

      --vp-c-brand-soft: rgba(255,122,24,.15);

      --vp-code-bg: #0b0f14;
      --vp-code-color: #e5e7eb;

      --vp-shadow-1: 0 1px 2px rgba(0,0,0,.4);
      --vp-shadow-2: 0 10px 40px rgba(0,0,0,.5);

      --vp-home-hero-name-color: var(--vp-c-brand-1);

      --vp-home-hero-image-background-image:
        radial-gradient(
          circle at center,
          rgba(255,122,24,.22),
          transparent 60%
        );
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;

      background:
        var(--vp-home-hero-image-background-image),
        var(--vp-c-bg);

      color: var(--vp-c-text-1);

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        sans-serif;

      padding: 48px 20px;
    }

    .container {
      width: min(100%, 920px);
      margin: auto;
    }

    .card {
      background: rgba(17,24,38,.72);

      border: 1px solid var(--vp-c-border);

      border-radius: 24px;

      padding: 42px;

      backdrop-filter: blur(16px);

      box-shadow: var(--vp-shadow-2);
    }

    h1 {
      font-size: clamp(2rem,4vw,3rem);
      margin-bottom: 12px;

      color: var(--vp-home-hero-name-color);
    }

    .subtitle {
      color: var(--vp-c-text-2);
      line-height: 1.7;
      margin-bottom: 36px;
    }

    .versions {
      display: grid;
      gap: 14px;
      margin-bottom: 42px;
    }

    .version-link {
      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 18px 22px;

      border-radius: 14px;

      text-decoration: none;

      background: var(--vp-c-bg-mute);

      border: 1px solid var(--vp-c-border);

      color: var(--vp-c-text-1);

      transition: .2s ease;
    }

    .version-link:hover {
      transform: translateY(-2px);

      border-color: var(--vp-c-brand-1);

      box-shadow: var(--vp-shadow-1);
    }

    .version-link .arrow {
      color: var(--vp-c-brand-1);
    }

    .help-box {
      padding: 24px;

      border-radius: 16px;

      background: var(--vp-c-brand-soft);

      border: 1px solid var(--vp-c-border);
    }

    .help-box h2 {
      color: var(--vp-c-brand-1);

      margin-bottom: 14px;

      font-size: 1.2rem;
    }

    .help-box p {
      color: var(--vp-c-text-2);

      line-height: 1.8;

      margin-bottom: 16px;
    }

    code {
      display: block;

      overflow-x: auto;

      background: var(--vp-code-bg);

      color: var(--vp-code-color);

      border: 1px solid var(--vp-c-border);

      border-radius: 12px;

      padding: 16px;

      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        monospace;
    }

    .empty {
      text-align: center;

      color: var(--vp-c-text-3);

      padding: 28px;
    }
  </style>
</head>

<body>
  <main class="container">
    <section class="card">

      <h1>Languify.js Versions</h1>

      <p class="subtitle">
        Browse available documentation <a target="_blank" href="https://github.com/imerik1/languify.js/tags">releases</a>.
      </p>

      <div class="help-box">
        <h2>Can't find your version?</h2>

        <p>
          If the desired version is not listed,
          you can manually navigate by replacing
          <code>version</code> in the URL below.
        </p>

        <code id="template">
          loading…
        </code>
      </div>
    </section>
    <a class="back-to-home" href="/docs">Back to home</a>
  </main>

    <script>
    const template = `${location.protocol}//${location.host}/docs/\${version}`;
    document.getElementById("template").textContent = template;
  </script>
</body>
</html>
