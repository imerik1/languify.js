<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="5; url=/docs" />
  <link rel="canonical" href="/docs/">
  <meta name="robots" content="noindex,follow">

  <title>Languify.js — Redirecting</title>

  <style>
    :root {
      color-scheme: dark;

      --bg: #0b0f14;
      --bg-soft: #111826;

      --text: #e5e7eb;
      --text-muted: #b4bcd0;

      --brand: #ff7a18;
      --brand-2: #ff5c00;

      --border: rgba(255,255,255,0.08);

      --shadow: 0 10px 40px rgba(0,0,0,.55);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(
          circle at center,
          rgba(255,122,24,.15),
          transparent 55%
        ),
        var(--bg);

      color: var(--text);
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        sans-serif;
    }

    .card {
      width: min(92vw, 640px);

      background: rgba(17,24,38,.75);
      backdrop-filter: blur(16px);

      border: 1px solid var(--border);
      border-radius: 24px;

      padding: 48px;

      text-align: center;

      box-shadow: var(--shadow);
    }

    h1 {
      font-size: clamp(2rem, 4vw, 3rem);
      margin-bottom: 12px;
      color: var(--brand);
    }

    p {
      color: var(--text-muted);
      line-height: 1.7;
      margin-bottom: 28px;
    }

    .loader {
      width: 52px;
      height: 52px;

      margin: 0 auto 28px;

      border: 4px solid rgba(255,122,24,.15);
      border-top-color: var(--brand);

      border-radius: 50%;

      animation: spin .9s linear infinite;
    }

    .btn {
      display: inline-block;

      padding: 14px 24px;

      background: linear-gradient(
        135deg,
        var(--brand),
        var(--brand-2)
      );

      color: white;
      text-decoration: none;
      font-weight: 600;

      border-radius: 12px;

      transition: .2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.08);
    }

    .hint {
      margin-top: 18px;
      font-size: .9rem;
      color: #6b7280;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="loader"></div>

    <h1>Languify.js</h1>

    <p>
      Redirecting you to the documentation…
      <br>
      If automatic navigation fails, use the button below.
    </p>

    <a href="/docs" class="btn">
      Open Documentation
    </a>

    <div class="hint">
      redirecting in ~5 seconds
    </div>
  </main>
</body>
</html>
