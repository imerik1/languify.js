name: Publishing
run-name: Publishing ${{ github.ref_name }}

on:
  push:
    tags:
      - v*

jobs:
  publish-npm:
    name: Publishing to NPM ${{ github.ref_name }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:ci

      - name: Run test
        run: pnpm test

      - name: Build library
        run: pnpm lib:build

  create-version:
    name: Creating version ${{ github.ref_name }}
    runs-on: ubuntu-latest
    needs: publish-npm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Clean dist folder
        run: pnpm purge

      - name: Run test
        run: pnpm test:coverage

      - name: Build documentation
        run: pnpm docs:build

      - name: Install rclone
        run: curl https://rclone.org/install.sh | bash

      - name: Configure rclone
        run: pnpm rclone:config
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ACCESS_KEY: ${{ secrets.CLOUDFLARE_ACCESS_KEY }}
          CLOUDFLARE_SECRET_KEY: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Publish new versions
        run: pnpm site:publish

  update-site:
    name: Updating site
    runs-on: ubuntu-latest
    needs: publish-npm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install rclone
        run: curl https://rclone.org/install.sh | bash

      - name: Configure rclone
        run: pnpm rclone:config
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ACCESS_KEY: ${{ secrets.CLOUDFLARE_ACCESS_KEY }}
          CLOUDFLARE_SECRET_KEY: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Download versions
        run: pnpm site:download

      - name: Deploy site
        run: pnpm site:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
